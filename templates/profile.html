{% extends 'base.html' %}
{% block title %}个人中心 · 校园智享{% endblock %}
{% block content %}
<section class="panel">
  <h1>个人中心</h1>
  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-grid"><label>用户名<input value="{{ g.user['username'] }}" disabled></label><label>学号<input value="{{ g.user['student_no'] }}" disabled></label></div>
    <div class="form-grid"><label>姓名<input name="name" maxlength="50" value="{{ g.user['name'] }}" required></label><label>联系方式<input name="contact" maxlength="100" value="{{ g.user['contact'] }}"></label></div>
    <div class="form-grid"><label>年级<input name="grade" value="{{ g.user['grade'] }}" required></label><label>班级<input name="class_name" value="{{ g.user['class_name'] }}" required></label></div>
    <h2>修改密码（可选）</h2>
    <div class="form-grid"><label>新密码<input type="password" minlength="8" name="new_password"></label><label>确认新密码<input type="password" minlength="8" name="password_confirm"></label></div>
    <button class="primary">保存</button>
  </form>
</section>
{% endblock %}
