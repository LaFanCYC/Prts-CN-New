{% extends 'base.html' %}
{% block title %}{{ '寻物启事' if kind == 'lost' else '拾物登记' }} · 校园智享{% endblock %}
{% block content %}<section class="panel"><h1>{{ '编辑' if editing else '发布' }}{{ '寻物启事' if kind == 'lost' else '拾物登记' }}</h1>{% if error %}<div class="flash error">{{ error }}</div>{% endif %}<form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>物品名称<input name="title" maxlength="50" value="{{ item['title'] if item else '' }}" required></label><label>详细描述<textarea name="description" maxlength="1000" rows="6" required>{{ item['description'] if item else '' }}</textarea></label><div class="form-grid"><label>发生日期<input type="date" name="occurred_on" max="{{ today }}" value="{{ item['occurred_on'] if item else '' }}" required></label><label>地点<input name="location" maxlength="100" value="{{ item['location'] if item else '' }}" required></label></div><label>关键词（逗号分隔）<input name="keywords" maxlength="200" value="{{ item['keywords'] if item else '' }}" required></label><label>图片（可选）<input type="file" name="image" accept="image/jpeg,image/png,image/webp"></label><button class="primary">保存并自动匹配</button></form></section>{% endblock %}
