{% extends 'base.html' %}
{% block title %}{{ '编辑帖子' if editing else '发布帖子' }} · 校园智享{% endblock %}
{% block content %}<section class="panel narrow"><h1>{{ '编辑帖子' if editing else '发布帖子' }}</h1>{% if error %}<div class="flash error">{{ error }}</div>{% endif %}<form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>标题<input name="title" maxlength="50" required value="{{ post['title'] if post else '' }}"></label><label>分区<select name="section" required>{% for key,label in sections.items() %}<option value="{{ key }}" {% if post and post['section']==key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>正文<textarea name="body" maxlength="2000" rows="10" required>{{ post['body'] if post else '' }}</textarea></label><label>标签<input name="tags" maxlength="154" required value="{{ tags if tags is defined else (post['tags'] if post and post['tags'] is defined else '') }}" placeholder="学习,Python"></label>{% if not editing %}<label>图片（可选，提交后人工审核）<input type="file" name="image" accept="image/jpeg,image/png,image/webp"></label>{% endif %}<button class="primary">保存</button></form></section>{% endblock %}
